<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقود — منصة العقود الفاخرة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="account.css?v=20261026b">
<style>
:root{--navy:#0f2744;--gold:#c9a84c;--ink:#1a2332;--muted:#5c6b7a;--line:#e2ddd4;}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(180deg,#eef2f6 0%,#f7f5f1 100%);color:var(--ink);min-height:100vh;padding:24px 0 60px;}
.logo-box{background:#fff;border-radius:12px;padding:8px 12px;display:inline-flex;flex-direction:column;align-items:center;margin-left:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none;}
.logo-box *{user-select:none;-webkit-user-select:none;}
.logo-box .circle{width:48px;height:48px;border:3px solid var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--navy);box-shadow:0 0 0 3px var(--gold);}
.logo-box .word{font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--navy);margin-top:4px;}
.header{background:linear-gradient(135deg,var(--navy) 0%,#1e4a78 50%,#2a5f9e 100%);color:#fff;padding:20px 22px;border-radius:22px;margin-bottom:22px;box-shadow:0 12px 32px rgba(15,39,68,.16);}
.header h1{font-family:'Amiri',serif;font-weight:700;font-size:2.1rem;margin:0;}
.header .lead{opacity:.9;font-size:.92rem;margin-top:2px;}
.form-section,.preview-section{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 24px rgba(15,39,68,.05);border:1px solid rgba(226,221,212,.6);}
.section-title{font-family:'Amiri',serif;font-size:1.3rem;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.req{color:#e74c3c;font-weight:700;}
.form-label{font-weight:600;color:var(--navy);font-size:.9rem;}
.form-control,.form-select{border-radius:10px;border:1px solid var(--line);padding:9px 12px;font-size:.94rem;}
.btn-primary{background:linear-gradient(135deg,#1e4a78,#2a6cb0);border:none;border-radius:10px;padding:9px 16px;font-weight:600;}
.party-card{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.party-card h6{font-family:'Amiri',serif;color:var(--navy);margin-bottom:8px;}
.contract-frame{border:5px solid var(--navy);border-radius:4px;padding:0;background:#fff;overflow:hidden;}
.contract-paper{background:#fff;padding:24px 20px;min-height:320px;font-family:'Amiri',serif;font-size:1.02rem;line-height:1.6;color:#1c2430;outline:none;}
.contract-paper.editing{background:#fffef8;box-shadow:inset 0 0 0 2px var(--gold);}
.contract-paper h2{font-family:'Cairo',sans-serif;font-weight:700;color:var(--navy);text-align:center;font-size:1.45rem;margin:0 0 4px;}
.contract-paper .meta{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:12px;font-family:'Tajawal',sans-serif;}
.clause-box{background:#fff;border:1px solid #f0ebe3;border-radius:6px;padding:10px 12px;margin:6px 0;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.lang-group{display:flex;gap:6px;}
.lang-group .btn{padding:5px 11px;font-size:.82rem;border-radius:8px;}
.editor-toolbar{display:none;background:#f8f9fa;border:1px solid #e2ddd4;border-radius:10px;padding:8px 10px;margin-bottom:10px;gap:6px;flex-wrap:wrap;align-items:center;}
.editor-toolbar.show{display:flex;}
.key-overlay{position:fixed;inset:0;background:rgba(15,39,68,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;display:none;align-items:center;justify-content:center;opacity:1;}
.key-overlay.show{display:flex;}
.key-overlay .modal-box{opacity:1;}
.key-status{font-size:.8rem;margin:-6px 0 12px;min-height:1em;}
.modal-box{background:#ffffff;border-radius:16px;padding:24px;width:min(440px,92vw);box-shadow:0 20px 50px rgba(15,39,68,.25);color:#1a2332;border:1px solid #b0b8c4;}
.bilingual-table{width:100%;border-collapse:collapse;margin:8px 0;}
.bilingual-table td{border:1px solid #eee;padding:10px 12px;vertical-align:top;width:50%;}
.bilingual-table .ar{text-align:right;direction:rtl;}
.bilingual-table .en{text-align:left;direction:ltr;font-family:'Cairo',sans-serif;}
.sig-row{display:flex;justify-content:space-between;margin-top:28px;font-family:'Tajawal',sans-serif;font-size:.9rem;}
.sig-box{width:46%;}
.sig-line{border-top:1px solid #ccc;padding-top:6px;margin-top:4px;}
.disclaimer{font-size:.78rem;color:#888;text-align:center;margin-top:20px;font-family:'Tajawal',sans-serif;}
.key-mask{-webkit-text-security:disc;text-security:disc;font-family:monospace;}
[dir=rtl] .form-select{background-position:left .75rem center;padding-left:2.5rem;padding-right:.9rem;}
[dir=ltr] .form-select{background-position:right .75rem center;padding-right:2.5rem;padding-left:.9rem;}
@media print{.no-print,.editor-toolbar{display:none!important;}.contract-frame{border:5px solid #000;}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="container" style="max-width:1080px;">
  <div class="header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div class="d-flex align-items-center">
      <div class="logo-box" id="logoMark" title="5 ضغطات لمفتاح OpenRouter">
        <div class="circle">ع</div>
        <div class="word">عقود</div>
      </div>
      <div>
        <h1 id="appTitle">عقود</h1>
        <p class="lead mb-0" id="appSubtitle">صياغة قانونية فاخرة</p>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 no-print">
      <button type="button" class="btn btn-sm btn-light" id="homeBtn"><i class="bi bi-house"></i> <span id="lblHome">الرئيسية</span></button>
      <button type="button" class="btn btn-sm btn-light" id="topLangBtn" title="تغيير اللغة"><i class="bi bi-globe"></i></button>
    </div>
  </div>

  <div class="form-section mb-4" id="formSection">
    <div class="section-title"><i class="bi bi-people"></i> <span id="lblParties">أطراف العقد</span></div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="party-card">
          <h6><span id="lblP1">الطرف الأول</span> <span class="req">*</span></h6>
          <input class="form-control mb-2" id="p1_name" placeholder="الاسم الكامل">
          <input class="form-control mb-2" id="p1_id" placeholder="رقم الهوية / الإقامة" maxlength="11">
          <input class="form-control mb-2" id="p1_mobile" placeholder="رقم الجوال">
          <input type="date" class="form-control" id="p1_dob">
        </div>
      </div>
      <div class="col-md-6">
        <div class="party-card">
          <h6><span id="lblP2">الطرف الثاني</span> <span class="req">*</span></h6>
          <input class="form-control mb-2" id="p2_name" placeholder="الاسم الكامل">
          <input class="form-control mb-2" id="p2_id" placeholder="رقم الهوية / الإقامة" maxlength="11">
          <input class="form-control mb-2" id="p2_mobile" placeholder="رقم الجوال">
          <input type="date" class="form-control" id="p2_dob">
        </div>
      </div>
    </div>

    <div class="section-title mt-3"><i class="bi bi-file-text"></i> <span id="lblDetails">تفاصيل العقد</span></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" id="lblType">نوع العقد</label>
        <select class="form-select" id="contractType">
          <option value="service">عقد خدمات / استشارة</option>
          <option value="sale">عقد بيع</option>
          <option value="rent">عقد إيجار</option>
          <option value="partnership">عقد شراكة</option>
          <option value="general">اتفاق عام</option>
          <option value="nda">اتفاقية سرية (مستقلة)</option>
        </select></div>
      <div class="col-md-6"><label class="form-label"><span id="lblTitle">عنوان العقد</span> <span class="req">*</span></label>
        <input class="form-control" id="contractTitle" placeholder="مثال: تقديم استشارة تقنية"></div>
      <div class="col-md-6"><label class="form-label" id="lblDate">التاريخ</label><input type="date" class="form-control" id="contractDate"></div>
      <div class="col-md-6"><label class="form-label" id="lblValue">القيمة</label><div class="input-group"><input type="number" inputmode="decimal" min="0" step="any" class="form-control" id="contractValue" name="contract-amount" autocomplete="off" data-1p-ignore data-lpignore="true"><select class="form-select" id="contractCurrency" style="max-width:46%" autocomplete="off"></select></div></div>
    </div>
    <div class="mt-3"><label class="form-label"><span id="lblRequest">ما تريده في العقد</span> <span class="req">*</span></label>
      <textarea class="form-control" id="userRequest" rows="4" placeholder="اكتب بلغتك العادية..."></textarea></div>
    <div class="mt-3"><label class="form-label" id="lblExtra">شروط إضافية (اختياري)</label>
      <textarea class="form-control" id="extraTerms" rows="2"></textarea></div>
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="includeNDA" checked>
      <label class="form-check-label" id="lblNDA" for="includeNDA">إضافة بنود اتفاقية السرية</label>
    </div>
    <div class="mt-3">
      <label class="form-label" id="lblUpload">رفع عقد للاستفادة من بنوده (اختياري)</label>
      <input type="file" class="form-control" id="uploadContract" accept=".txt,.pdf,.html">
    </div>
    <div class="mt-3">
      <label class="form-label" id="lblLogo">شعار العقد (اختياري) — يظهر ككليشة علوية</label>
      <input type="file" class="form-control" id="logoUpload" accept="image/*">
    </div>

    <div class="actions mt-4">
      <div class="lang-group me-2">
        <button type="button" class="btn btn-outline-primary active" data-lang="ar">عربي</button>
        <button type="button" class="btn btn-outline-primary" data-lang="en">English</button>
        <button type="button" class="btn btn-outline-primary" data-lang="both">لغتين</button>
      </div>
      <button type="button" id="aiGenerateBtn" class="btn btn-primary"><i class="bi bi-stars"></i> <span id="lblGenerate">صياغة قانونية</span></button>
      <button type="button" id="clearBtn" class="btn btn-outline-secondary" id="lblClear">مسح</button>
    </div>
  </div>

  <div class="preview-section" id="previewSection" style="display:none;">
    <div class="section-title d-flex justify-content-between align-items-center">
      <span><i class="bi bi-file-earmark-text"></i> <span id="lblPreview">معاينة العقد</span></span>
      <button type="button" class="btn btn-sm btn-outline-primary no-print" id="toggleEdit"><i class="bi bi-pencil"></i> <span id="lblEdit">تعديل النص</span></button>
    </div>

    <div class="editor-toolbar no-print" id="editorToolbar">
      <select class="form-select form-select-sm" id="fontSelect" style="width:auto;">
        <option value="Amiri, serif">Amiri</option>
        <option value="Cairo, sans-serif">Cairo</option>
        <option value="Tajawal, sans-serif">Tajawal</option>
      </select>
      <select class="form-select form-select-sm" id="sizeSelect" style="width:auto;">
        <option value="0.95rem">صغير</option>
        <option value="1.02rem" selected>عادي</option>
        <option value="1.15rem">كبير</option>
      </select>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="boldBtn"><b>B</b></button>
      <label class="d-flex align-items-center gap-1 small">تظليل <input type="color" id="highlightColor" value="#fff3cd" style="width:32px;height:28px;border:none;padding:0;"></label>
      <button type="button" class="btn btn-sm btn-outline-warning" id="highlightBtn">تظليل</button>
      <button type="button" class="btn btn-sm btn-success" id="finishEdit">انتهيت التعديل</button>
    </div>
    <p class="small text-muted no-print mb-2" id="lblNote">لتعديلات أكثر صدّر لوورد ثم احفظه PDF كنص.</p>

    <div class="contract-frame">
      <div class="contract-paper" id="contractPreview" contenteditable="false"></div>
    </div>
    <div class="src-box no-print" id="sourcesBox" hidden></div>
    <div class="actions">
      <button type="button" id="printBtn" class="btn btn-outline-primary"><i class="bi bi-printer"></i> <span id="lblPrint">طباعة</span></button>
      <button type="button" id="downloadBtn" class="btn btn-outline-success"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      <button type="button" id="wordBtn" class="btn btn-outline-primary"><i class="bi bi-file-earmark-word"></i> <span id="lblWord">وورد</span></button>
      <button type="button" id="saveLocalBtn" class="btn btn-outline-secondary"><i class="bi bi-save"></i> <span id="lblSave">حفظ محلي</span></button>
      <button type="button" id="backToForm" class="btn btn-outline-secondary"><span id="lblBack">رجوع للتعديل</span></button>
      <button type="button" id="homeBtn2" class="btn btn-outline-secondary ms-auto"><i class="bi bi-house"></i> <span id="lblHome2">الرئيسية</span></button>
    </div>
  </div>

  <div class="form-section mt-4 no-print">
    <div class="section-title"><i class="bi bi-folder2-open"></i> <span id="lblSaved">العقود المحفوظة محلياً</span></div>
    <div id="contractsList"></div>
  </div>
</div>

<div class="key-overlay" id="keyModal">
  <div class="modal-box">
    <h5 class="mb-3" style="font-family:Amiri;color:#0f2744;">مفتاح OpenRouter</h5>
    <p class="small mb-3" style="color:#333;">يُحفظ في متصفحك فقط، ويُستخدم لصياغة عقودك. تقدر تاخذ مفتاح من <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.</p>
    <input type="text" class="form-control mb-3 key-mask" dir="ltr" id="apiKeyInput" placeholder="sk-or-v1-..." autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true">
    <div class="key-status" id="keyStatus"></div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" id="saveKeyBtn">حفظ</button>
      <button type="button" class="btn btn-outline-secondary" id="closeKeyBtn">إغلاق</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const { jsPDF } = window.jspdf;
  const preview = document.getElementById('contractPreview');
  const formSection = document.getElementById('formSection');
  const previewSection = document.getElementById('previewSection');
  const logo = document.getElementById('logoMark');
  const toolbar = document.getElementById('editorToolbar');
  let clickCount = 0, clickTimer = null, currentLang = 'ar', isEditing = false, uiLang = 'ar';
  const SITE = window.OQ_SITE = {
    title: 'عقود', subtitle: 'صياغة قانونية فاخرة',
    disclaimer: 'هذا العقد تم إعداده باجتهاد شخصي وليس صادراً من مكتب محاماة. يُنصح بمراجعته من مختص قبل التوقيع.',
    wordHeader: 'منصة عقود — كليشة علوية',
    wordFooter: 'منصة عقود — كليشة سفلية | هذا العقد باجتهاد شخصي وليس من مكتب محاماة',
    subscribeMsg: 'أضف مفتاح OpenRouter حقك، أو تواصل معنا للاشتراك.'
  };
  window.applySite = function (cfg, types) {
    if (cfg) Object.keys(SITE).forEach(k => { if (typeof cfg[k] === 'string' && cfg[k].trim()) SITE[k] = cfg[k].trim(); });
    if (uiLang !== 'en') {
      document.getElementById('appTitle').textContent = SITE.title;
      document.getElementById('appSubtitle').textContent = SITE.subtitle;
      document.title = SITE.title + ' — ' + SITE.subtitle;
    }
    if (Array.isArray(types) && types.length) {
      const sel = document.getElementById('contractType'), cur = sel.options[sel.selectedIndex]?.text;
      sel.innerHTML = types.map(t => `<option value="${t.id}">${escH(t.label)}</option>`).join('');
      const keep = [...sel.options].find(o => o.text === cur); if (keep) sel.value = keep.value;
    }
  };

  const T = {
    ar: {
      home:'الرئيسية', parties:'أطراف العقد', p1:'الطرف الأول', p2:'الطرف الثاني',
      details:'تفاصيل العقد', type:'نوع العقد', title:'عنوان العقد', date:'التاريخ', value:'القيمة',
      request:'ما تريده في العقد', extra:'شروط إضافية (اختياري)', nda:'إضافة بنود اتفاقية السرية',
      upload:'رفع عقد للاستفادة من بنوده (اختياري)', logo:'شعار العقد (اختياري) — يظهر ككليشة علوية',
      generate:'صياغة قانونية', clear:'مسح', preview:'معاينة العقد', edit:'تعديل النص',
      print:'طباعة', word:'وورد', save:'حفظ محلي', back:'رجوع للتعديل', saved:'العقود المحفوظة محلياً',
      note:'لتعديلات أكثر صدّر لوورد ثم احفظه PDF كنص.',
      phName:'الاسم الكامل', phId:'رقم الهوية / الإقامة', phMobile:'رقم الجوال',
      phTitle:'مثال: تقديم استشارة تقنية', phRequest:'اكتب بلغتك العادية...'
    },
    en: {
      home:'Home', parties:'Contract Parties', p1:'Party One', p2:'Party Two',
      details:'Contract Details', type:'Contract Type', title:'Contract Title', date:'Date', value:'Value',
      request:'What you want in the contract', extra:'Additional Terms (optional)', nda:'Add confidentiality clauses',
      upload:'Upload contract to use its clauses (optional)', logo:'Contract Logo (optional) — appears as header',
      generate:'Generate Legal Draft', clear:'Clear', preview:'Contract Preview', edit:'Edit Text',
      print:'Print', word:'Word', save:'Save Local', back:'Back to Edit', saved:'Locally Saved Contracts',
      note:'For more edits, export to Word then save as text PDF.',
      phName:'Full Name', phId:'ID / Iqama Number', phMobile:'Mobile Number',
      phTitle:'Example: Technical Consultation', phRequest:'Write in your own words...'
    }
  };

  function setLang(lang) {
    uiLang = lang;
    const t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.body.style.direction = lang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('appTitle').textContent = lang === 'en' ? 'Oqood' : SITE.title;
    document.getElementById('appSubtitle').textContent = lang === 'en' ? 'Premium Legal Drafting' : SITE.subtitle;
    const map = {
      lblHome:t.home, lblHome2:t.home, lblParties:t.parties, lblP1:t.p1, lblP2:t.p2,
      lblDetails:t.details, lblType:t.type, lblTitle:t.title, lblDate:t.date, lblValue:t.value,
      lblRequest:t.request, lblExtra:t.extra, lblNDA:t.nda, lblUpload:t.upload, lblLogo:t.logo,
      lblGenerate:t.generate, lblClear:t.clear, lblPreview:t.preview, lblEdit:t.edit,
      lblPrint:t.print, lblWord:t.word, lblSave:t.save, lblBack:t.back, lblSaved:t.saved, lblNote:t.note
    };
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = map[id];
    });
    fillCurrencies(lang);
    document.getElementById('p1_name').placeholder = t.phName;
    document.getElementById('p2_name').placeholder = t.phName;
    document.getElementById('p1_id').placeholder = t.phId;
    document.getElementById('p2_id').placeholder = t.phId;
    document.getElementById('p1_mobile').placeholder = t.phMobile;
    document.getElementById('p2_mobile').placeholder = t.phMobile;
    document.getElementById('contractTitle').placeholder = t.phTitle;
    document.getElementById('userRequest').placeholder = t.phRequest;
  }

  document.getElementById('topLangBtn').onclick = () => setLang(uiLang === 'ar' ? 'en' : 'ar');

  function goHome() {
    previewSection.style.display = 'none';
    formSection.style.display = 'block';
    formSection.scrollIntoView({ behavior: 'smooth' });
    if (isEditing) document.getElementById('finishEdit').click();
  }
  const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = goHome;
  document.getElementById('homeBtn2').onclick = goHome;
  window.oqoodHome = goHome;

  function openKeyModal() {
      const k = localStorage.getItem('oqood_openrouter_key') || '';
      document.getElementById('apiKeyInput').value = k;
      keyStatus(k ? 'المفتاح محفوظ في هذا المتصفح ✓' : 'لا يوجد مفتاح محفوظ', k ? '#1a7f4b' : '#888');
      document.getElementById('keyModal').classList.add('show');
      setTimeout(() => document.getElementById('apiKeyInput').focus(), 50);
  }
  window.openKeyModal = openKeyModal;
  logo.addEventListener('click', () => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => clickCount = 0, 1500);
    if (clickCount >= 5) { clickCount = 0; openKeyModal(); }
  });
  logo.addEventListener('mousedown', e => e.preventDefault());
  logo.addEventListener('selectstart', e => e.preventDefault());

  function keyStatus(t, c) { const el = document.getElementById('keyStatus'); el.textContent = t; el.style.color = c; }
  document.getElementById('saveKeyBtn').onclick = () => {
    const v = document.getElementById('apiKeyInput').value.trim();
    if (!v) { keyStatus('اكتب المفتاح أولاً', '#c0392b'); return; }
    try { localStorage.setItem('oqood_openrouter_key', v); } catch (e) { keyStatus('تعذّر الحفظ في هذا المتصفح', '#c0392b'); return; }
    keyStatus('تم الحفظ ✓', '#1a7f4b');
    setTimeout(() => document.getElementById('keyModal').classList.remove('show'), 700);
    if (window.OQ && OQ.refresh) OQ.refresh();
  };
  document.getElementById('keyModal').addEventListener('click', e => { if (e.target.id === 'keyModal') e.currentTarget.classList.remove('show'); });
  document.getElementById('closeKeyBtn').onclick = () => document.getElementById('keyModal').classList.remove('show');

  document.getElementById('contractDate').valueAsDate = new Date();

  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      document.querySelectorAll('[data-lang]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('toggleEdit').onclick = () => {
    isEditing = !isEditing;
    preview.contentEditable = isEditing;
    preview.classList.toggle('editing', isEditing);
    toolbar.classList.toggle('show', isEditing);
    document.getElementById('lblEdit').textContent = isEditing ? 'منتهي' : (uiLang==='en'?'Edit Text':'تعديل النص');
    if (isEditing) preview.focus();
  };
  document.getElementById('finishEdit').onclick = () => {
    isEditing = false;
    preview.contentEditable = false;
    preview.classList.remove('editing');
    toolbar.classList.remove('show');
    document.getElementById('lblEdit').textContent = uiLang==='en'?'Edit Text':'تعديل النص';
  };

  document.getElementById('boldBtn').onclick = () => document.execCommand('bold');
  document.getElementById('highlightBtn').onclick = () => {
    const c = document.getElementById('highlightColor').value;
    document.execCommand('hiliteColor', false, c);
  };
  document.getElementById('fontSelect').onchange = function() { preview.style.fontFamily = this.value; };
  document.getElementById('sizeSelect').onchange = function() { preview.style.fontSize = this.value; };

  function validateID(id) {
    if (!id) return true;
    return /^\d{10,11}$/.test(id.replace(/\D/g,''));
  }

  const CURRENCIES = [
    ['SAR','ريال سعودي','Saudi Riyal'], ['USD','دولار أمريكي','US Dollar'], ['EUR','يورو','Euro'],
    ['AED','درهم إماراتي','UAE Dirham'], ['KWD','دينار كويتي','Kuwaiti Dinar'], ['QAR','ريال قطري','Qatari Riyal'],
    ['BHD','دينار بحريني','Bahraini Dinar'], ['OMR','ريال عماني','Omani Rial'], ['EGP','جنيه مصري','Egyptian Pound'],
    ['GBP','جنيه إسترليني','British Pound']
  ];
  function fillCurrencies(lang) {
    const sel = document.getElementById('contractCurrency');
    let cur = sel.value;
    if (!cur) { try { cur = localStorage.getItem('oqood.currency') || 'SAR'; } catch (e) { cur = 'SAR'; } }
    sel.innerHTML = CURRENCIES.map(c => `<option value="${c[0]}">${lang === 'en' ? c[2] : c[1]} (${c[0]})</option>`).join('');
    sel.value = CURRENCIES.some(c => c[0] === cur) ? cur : 'SAR';
  }
  function currencyText(code) {
    const c = CURRENCIES.find(x => x[0] === code) || CURRENCIES[0];
    return `${c[1]} (${c[2]} - ${c[0]})`;
  }

  const escH = (x) => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function collectData() {
    return {
      typeLabel: document.getElementById('contractType').options[document.getElementById('contractType').selectedIndex].text,
      typeId: /^\d+$/.test(document.getElementById('contractType').value) ? document.getElementById('contractType').value : '',
      title: document.getElementById('contractTitle').value,
      date: document.getElementById('contractDate').value,
      value: document.getElementById('contractValue').value,
      currency: document.getElementById('contractCurrency').value || 'SAR',
      userRequest: document.getElementById('userRequest').value,
      extraTerms: document.getElementById('extraTerms').value,
      includeNDA: document.getElementById('includeNDA').checked,
      lang: currentLang,
      p1: { name: document.getElementById('p1_name').value, id: document.getElementById('p1_id').value, mobile: document.getElementById('p1_mobile').value, dob: document.getElementById('p1_dob').value },
      p2: { name: document.getElementById('p2_name').value, id: document.getElementById('p2_id').value, mobile: document.getElementById('p2_mobile').value, dob: document.getElementById('p2_dob').value }
    };
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' });
  }

  async function generateWithAI() {
    const d = collectData();
    const useServer = !!(window.OQ && OQ.ready);
    const key = localStorage.getItem('oqood_openrouter_key') || '';
    if (useServer && !OQ.user()) { OQ.open(); return; }
    if (!useServer && !key) { alert('أضغط على الشعار "ع" خمس مرات لإدخال مفتاح OpenRouter'); return; }
    if (!d.p1.name || !d.p2.name || !d.title || !d.userRequest) {
      alert('يرجى ملء الحقول الإلزامية');
      return;
    }
    if (!validateID(d.p1.id) || !validateID(d.p2.id)) {
      alert('رقم الهوية/الإقامة يجب أن يكون 10 أو 11 رقماً');
      return;
    }

    const btn = document.getElementById('aiGenerateBtn');
    const old = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> جاري الصياغة...';

    let uploadedText = '';
    const fileInput = document.getElementById('uploadContract');
    if (fileInput.files && fileInput.files[0]) {
      try { uploadedText = await fileInput.files[0].text(); } catch(e) {}
    }

    const langNote = d.lang === 'en' ? 'اكتب العقد بالإنجليزية فقط.' :
                     d.lang === 'both' ? 'اكتب العقد بتنسيق جدول ثنائي: العربي في العمود الأيمن والإنألجليزي في العمود الأيسر. استخدم <table class="bilingual-table"><tr><td class="ar">...</td><td class="en">...</td></tr></table> لكل مادة. التوقيعات متقابلة.' :
                     'اكتب العقد بالعربية الفصحى فقط. اترك سطر فارغ بين كل مادة.';

    const prompt = `أنت محام سعودي محترف. اكتب عقداً قانونياً كاملاً ورسمياً.
${langNote}

البيانات:
- نوع العقد: ${d.typeLabel}
- العنوان: ${d.title}
- التاريخ: ${formatDate(d.date)}
- القيمة: ${d.value ? d.value + ' ' + currencyText(d.currency) : 'غير محددة'}

الطرف الأول: ${d.p1.name} | هوية: ${d.p1.id||'-'} | جوال: ${d.p1.mobile||'-'} | ميلاد: ${formatDate(d.p1.dob)||'-'}
الطرف الثاني: ${d.p2.name} | هوية: ${d.p2.id||'-'} | جوال: ${d.p2.mobile||'-'} | ميلاد: ${formatDate(d.p2.dob)||'-'}

ما يريده الطرف:\n${d.userRequest}

${d.extraTerms ? 'شروط إضافية: '+d.extraTerms : ''}
${d.includeNDA ? 'أضف قسم اتفاقية سرية مناسب.' : ''}
${uploadedText ? '\n\nنص مرفوع للاستفادة:\n'+uploadedText.substring(0,2500) : ''}

المطلوب:
- صياغة قانونية رسمية متكاملة.
- ابدأ مباشرة بنص العقد.
- استخدم HTML بسيط. اترك سطر فارغ بين المواد.`;

    let sources = [];
    try {
      let text = '';
      if (useServer) {
        const fmt = (p) => ({ name: p.name, id: p.id, mobile: p.mobile, dob: formatDate(p.dob) });
        const r = await OQ.draft({
          d: { typeId: d.typeId, typeLabel: d.typeLabel, title: d.title, date: formatDate(d.date), valueText: d.value ? d.value + ' ' + currencyText(d.currency) : '',
               userRequest: d.userRequest, extraTerms: d.extraTerms, includeNDA: d.includeNDA, lang: d.lang, p1: fmt(d.p1), p2: fmt(d.p2) },
          uploadedText: uploadedText.substring(0, 2500)
        });
        text = String(r.html || '').replace(/```html|```/g,'').trim();
        sources = r.sources || [];
      } else {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json',
          'HTTP-Referer': location.origin || 'https://github.com',
          'X-Title': 'Oqood'
        },
        body: JSON.stringify({
          model: 'openai/gpt-4o-mini',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.25
        })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      text = (data.choices?.[0]?.message?.content || '').replace(/```html|```/g,'').trim();
      }
      if (!text.includes('<')) text = '<p>' + text.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';

      let logoHtml = '';
      const logoFile = document.getElementById('logoUpload').files[0];
      if (logoFile) {
        const reader = new FileReader();
        logoHtml = await new Promise(resolve => {
          reader.onload = e => resolve(`<div class="text-center mb-2"><img src="${e.target.result}" style="max-height:55px;"></div>`);
          reader.readAsDataURL(logoFile);
        });
      }

      preview.innerHTML = `
        ${logoHtml}
        <h2>${d.title}</h2>
        <div class="meta">${d.typeLabel} — ${formatDate(d.date)}</div>
        <hr style="border:none;border-top:1px solid #e8e2d6;margin:10px 0;">
        <div class="clause-box">${text}</div>
        <div class="sig-row">
          <div class="sig-box" style="text-align:right;"><div class="sig-line">توقيع الطرف الأول</div><div>${d.p1.name}</div></div>
          <div class="sig-box" style="text-align:left;"><div class="sig-line">توقيع الطرف الثاني</div><div>${d.p2.name}</div></div>
        </div>
        <div class="disclaimer">${escH(SITE.disclaimer)}</div>
      `;

      const sb = document.getElementById('sourcesBox');
      sb.hidden = !sources.length;
      sb.innerHTML = sources.length ? `<details><summary>المواد النظامية اللي رجعت لها المنصة (${sources.length})</summary><ol>${sources.map(s => `<li>${escH(s.law)} — ${escH(s.num)}${s.url ? ` · <a href="${escH(s.url)}" target="_blank" rel="noopener">المصدر</a>` : ''}</li>`).join('')}</ol><p class="small text-muted mb-0">هذي المواد اللي أُعطيت للصياغة. المواد اللي استند لها العقد فعلاً مذكورة في قسم «المرجعية النظامية» آخر العقد.</p></details>` : '';

      formSection.style.display = 'none';
      previewSection.style.display = 'block';
      previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      if (!err.quiet) alert('خطأ: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = old;
    }
  }

  fillCurrencies(document.documentElement.lang === 'en' ? 'en' : 'ar');
  document.getElementById('contractCurrency').addEventListener('change', e => { try { localStorage.setItem('oqood.currency', e.target.value); } catch (x) {} });
  document.querySelectorAll('#formSection input:not([type=file]):not([type=checkbox]), #formSection textarea').forEach(el => { el.setAttribute('autocomplete', 'off'); el.setAttribute('data-1p-ignore', ''); });
  document.getElementById('aiGenerateBtn').addEventListener('click', generateWithAI);
  document.getElementById('backToForm').addEventListener('click', goHome);
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('مسح جميع البيانات؟')) {
      document.querySelectorAll('#formSection input:not([type=file]), #formSection textarea').forEach(el => el.value = '');
      document.getElementById('contractDate').valueAsDate = new Date();
      preview.innerHTML = '';
      previewSection.style.display = 'none';
      formSection.style.display = 'block';
    }
  });
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  document.getElementById('wordBtn').addEventListener('click', () => {
    if (!preview.innerText.trim()) { alert('صّغ العقد أولاً'); return; }
    const title = document.getElementById('contractTitle').value || 'عقد';
    const safeName = title.replace(/[\\/:*?"<>|]/g,'').trim() || 'عقد';
    const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${safeName}</title></head><body style="font-family:Amiri,serif;padding:30px;">
      <div style="text-align:center;font-family:Cairo,sans-serif;font-size:11px;color:#666;margin-bottom:20px;">${escH(SITE.wordHeader)}</div>
      ${preview.innerHTML}
      <div style="text-align:center;font-size:10px;color:#999;margin-top:40px;border-top:1px solid #ddd;padding-top:10px;">${escH(SITE.wordFooter)}</div>
    </body></html>`;
    const blob = new Blob([html], { type: 'application/msword' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeName + '.doc';
    a.click();
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    if (!preview.innerText.trim()) { alert('صّغ العقد أولاً'); return; }
    const title = document.getElementById('contractTitle').value || 'عقد';
    const safeName = title.replace(/[\\/:*?"<>|]/g,'').trim() || 'عقد';
    const canvas = await html2canvas(document.querySelector('.contract-frame'), { scale: 1.5, useCORS: true, backgroundColor: '#ffffff' });
    const img = canvas.toDataURL('image/jpeg', 0.72);
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW - 14;
    const imgH = (canvas.height * imgW) / canvas.width;
    if (imgH <= pageH - 14) {
      pdf.addImage(img, 'JPEG', 7, 7, imgW, imgH);
    } else {
      let remaining = imgH, srcY = 0;
      while (remaining > 0) {
        const sliceH = Math.min(pageH - 14, remaining);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = Math.max(1, (sliceH / imgH) * canvas.height);
        const ctx = sliceCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, srcY, canvas.width, sliceCanvas.height, 0, 0, canvas.width, sliceCanvas.height);
        pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.72), 'JPEG', 7, 7, imgW, sliceH);
        remaining -= sliceH;
        srcY += sliceCanvas.height;
        if (remaining > 0) pdf.addPage();
      }
    }
    pdf.save(safeName + '.pdf');
  });

  document.getElementById('saveLocalBtn').addEventListener('click', () => {
    const d = collectData();
    d.previewHtml = preview.innerHTML;
    let list = JSON.parse(localStorage.getItem('oqood_contracts') || '[]');
    list.push(d);
    localStorage.setItem('oqood_contracts', JSON.stringify(list));
    loadList();
    alert('تم الحفظ');
  });

  function loadList() {
    const list = JSON.parse(localStorage.getItem('oqood_contracts') || '[]');
    const container = document.getElementById('contractsList');
    if (!list.length) { container.innerHTML = '<p class="text-muted text-center">لا توجد عقود محفوظة</p>'; return; }
    container.innerHTML = list.map((c,i) => `
      <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
        <div><strong>${c.title||'عقد'}</strong><div class="text-muted small">${c.p1?.name||''} — ${c.p2?.name||''}</div></div>
        <div>
          <button class="btn btn-sm btn-outline-primary me-1 view" data-i="${i}">عرض</button>
          <button class="btn btn-sm btn-outline-danger del" data-i="${i}">حذف</button>
        </div>
      </div>
    `).join('');
    container.querySelectorAll('.view').forEach(b => b.onclick = () => {
      const c = list[b.dataset.i];
      if (c.previewHtml) {
        preview.innerHTML = c.previewHtml;
        formSection.style.display = 'none';
        previewSection.style.display = 'block';
        previewSection.scrollIntoView({behavior:'smooth'});
      }
    });
    container.querySelectorAll('.del').forEach(b => b.onclick = () => {
      if (confirm('حذف؟')) {
        list.splice(b.dataset.i,1);
        localStorage.setItem('oqood_contracts', JSON.stringify(list));
        loadList();
      }
    });
  }
  loadList();
});
</script>
